<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19; color: #ffffff; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }
        h1 { margin: 5px 0 2px 0; color: #fbbf24; font-size: 24px; text-align: center; text-shadow: 0 0 8px rgba(251,191,36,0.3); }
        .subtitle { color: #94a3b8; font-size: 11px; margin-bottom: 12px; text-align: center; }
        
        .game-layout {
            display: flex; flex-direction: column; width: 100%; max-width: 430px;
            background: #1e293b; padding: 15px; border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); gap: 12px;
        }

        /* 雙狀態儀表板 */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #0f172a; padding: 8px; border-radius: 10px; border: 1px solid #334155; }
        .stat-label { font-size: 11px; color: #cbd5e1; margin-bottom: 4px; font-weight: bold; }
        .progress-container { background: #334155; border-radius: 6px; height: 16px; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; width: 100%; transition: width 0.3s ease; }
        .bar-patience { background: linear-gradient(90deg, #10b981, #059669); }
        .bar-time { background: linear-gradient(90deg, #3b82f6, #1d4ed8); width: 0%; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 1px; font-size: 10px; color: white; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        /* 垂直線性地圖 */
        .map-viewport {
            background: #0f172a; border-radius: 12px; padding: 15px 10px; max-height: 200px;
            overflow-y: scroll; position: relative; border: 1px solid #334155; -webkit-overflow-scrolling: touch;
        }
        .map-viewport::before { content: ''; position: absolute; left: 35px; top: 0; bottom: 0; width: 4px; background: #475569; z-index: 1; }
        .timeline-node { display: flex; align-items: center; margin-bottom: 15px; position: relative; z-index: 2; }
        .timeline-node:last-child { margin-bottom: 0; }
        
        .node-circle {
            width: 34px; height: 34px; background: #334155; color: #94a3b8; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            font-weight: bold; border: 3px solid #475569; margin-right: 15px; transition: all 0.3s;
        }
        .node-info-text { flex: 1; }
        .node-title { font-size: 14px; font-weight: bold; color: #e2e8f0; }
        .node-meta { font-size: 11px; color: #64748b; }
        .active .node-circle { border-color: #fbbf24; background: #fbbf24; color: #0f172a; transform: scale(1.1); box-shadow: 0 0 10px #fbbf24; }
        .st-start .node-circle { background: #10b981; color: white; border-color: #059669; }
        .st-end .node-circle { background: #3b82f6; color: white; border-color: #2563eb; }

        .bus-marker {
            position: absolute; left: 21px; font-size: 20px; z-index: 10;
            transition: top 0.6s cubic-bezier(0.25, 1, 0.5, 1); margin-top: -10px; pointer-events: none;
        }

        /* 事件卡片 */
        .event-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
        .event-heading { font-size: 16px; font-weight: bold; color: #fbbf24; margin-bottom: 4px; }
        .event-impact { font-size: 12px; font-weight: bold; color: #f43f5e; margin-bottom: 6px; }
        .event-desc { font-size: 13px; color: #cbd5e1; line-height: 1.4; }

        /* 控制按鈕 */
        .action-area { display: flex; align-items: center; gap: 10px; }
        .dice-box { font-size: 36px; width: 50px; text-align: center; }
        .btn-main {
            background: #fbbf24; color: #0f172a; border: none; padding: 14px;
            font-size: 17px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1;
            box-shadow: 0 4px 0 #b45309; transition: 0.1s;
        }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #b45309; }
        .btn-main:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        .btn-restart { background: #10b981; color: white; box-shadow: 0 4px 0 #047857; }

        /* ─── 互動小遊戲全螢幕遮罩與豐富動畫 ─── */
        .mini-game-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.98); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .game-window {
            width: 100%; max-width: 360px; background: #1e293b; border: 2px solid #475569;
            border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.7); position: relative; animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* 視覺互動組件庫 */
        .interactive-zone { width: 100%; min-height: 150px; margin: 15px 0; display: flex; align-items: center; justify-content: center; position: relative; background: #0f172a; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        
        /* 1. 精準攔截動態條 */
        .slider-track { width: 90%; height: 20px; background: #334155; border-radius: 10px; position: relative; }
        .slider-target { position: absolute; left: 45%; width: 15%; height: 100%; background: #10b981; border-radius: 4px; box-shadow: 0 0 10px #10b981; }
        .slider-pin { position: absolute; left: 0%; width: 8px; height: 140%; top: -20%; background: #f43f5e; border-radius: 2px; transition: left 0.05s linear; }
        
        /* 2. 蓄力圓圈 */
        .charge-ring { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #334155; position: relative; display: flex; align-items: center; justify-content: center; }
        .charge-fill { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: 8px solid #fbbf24; border-top-color: transparent; border-left-color: transparent; transform: rotate(-45deg); transition: transform 0.1s linear; display: none;}
        .charge-btn { width: 80px; height: 80px; background: #f43f5e; border-radius: 50%; border: none; color: white; font-weight: bold; cursor: pointer; z-index: 5; }
        
        /* 3. 平衡球 */
        .balance-board { width: 80%; height: 10px; background: #cbd5e1; border-radius: 5px; position: relative; transition: transform 0.1s linear; }
        .balance-ball { width: 24px; height: 24px; background: #fbbf24; border-radius: 50%; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); transition: left 0.1s linear; box-shadow: 0 0 8px #fbbf24; }
        
        /* 4. 左右閃躲格 */
        .dodge-container { display: flex; width: 90%; justify-content: space-between; gap: 10px; }
        .dodge-lane { flex: 1; height: 120px; background: #1e293b; border-radius: 8px; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; border: 1px dashed #475569; }
        .dodge-lane.danger { background: rgba(244,63,94,0.2); border-color: #f43f5e; animation: flash 0.3s infinite alternate; }
        @keyframes flash { from { opacity: 0.5; } to { opacity: 1; } }
        .player-box { width: 30px; height: 30px; background: #3b82f6; border-radius: 6px; font-size: 20px; display: flex; align-items: center; justify-content: center; }

        /* 5. 記憶方塊 */
        .memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 180px; }
        .grid-block { width: 50px; height: 50px; background: #334155; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .grid-block.active { background: #fbbf24; box-shadow: 0 0 12px #fbbf24; }

        /* 💥 打架動畫特製樣式 */
        .fight-arena { display: flex; align-items: center; justify-content: center; gap: 40px; position: relative; width: 100%; height: 120px; }
        .fighter { font-size: 40px; transition: transform 0.15s ease-in-out; }
        .fighter-left { animation: punchLeft 0.5s infinite ease-in-out alternate; }
        .fighter-right { animation: punchRight 0.5s infinite ease-in-out alternate 0.25s; }
        .clash-fx { position: absolute; font-size: 30px; opacity: 0; transform: scale(0.5); pointer-events: none; transition: all 0.1s ease-out; color: #fbbf24; font-weight: bold; text-shadow: 0 0 8px #f59e0b; }
        .clash-fx.hit { opacity: 1; transform: scale(1.3); }

        @keyframes punchLeft {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(35px) rotate(15deg); }
        }
        @keyframes punchRight {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(-35px) rotate(-15deg); }
        }

        /* 計時與通用按鈕 */
        .game-timer-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-top: 15px; overflow: hidden; }
        .game-timer-fill { height: 100%; background: #fbbf24; width: 100%; }
        .interact-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 15px; margin-top: 10px; box-shadow: 0 3px 0 #1d4ed8; }
        .interact-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #1d4ed8; }
    </style>
</head>
<body>

    <h1>桃園公車通勤地獄</h1>
    <div class="subtitle">【十全互動大師版】10種不重複核心小遊戲・動態視覺反饋</div>

    <div class="game-layout">
        <!-- 儀表板 -->
        <div class="dashboard">
            <div class="stat-box">
                <div class="stat-label">🧠 乘客理智值</div>
                <div class="progress-container">
                    <div id="bar-pat" class="progress-bar bar-patience"></div>
                    <div id="text-pat" class="progress-text">120/120</div>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-label">⏰ 已通勤時間</div>
                <div class="progress-container">
                    <div id="bar-time" class="progress-bar bar-time"></div>
                    <div id="text-time" class="progress-text">0/100分</div>
                </div>
            </div>
        </div>
        
        <!-- 線性公車站 -->
        <div class="map-viewport" id="map-scroll-box">
            <div id="bus-marker" class="bus-marker">🚌</div>
            <div id="timeline-container"></div>
        </div>

        <!-- 事件說明 -->
        <div class="event-card">
            <div id="ev-title" class="event-heading">📢 發車準備中</div>
            <div id="ev-impact" class="event-impact"></div>
            <div id="ev-desc" class="event-desc">中壢客運總站即將發車。前方路況險惡，將隨機迎來10種完全不同的多動態考驗，請保持警惕！</div>
        </div>
        
        <!-- 控制鈕 -->
        <div class="action-area">
            <div id="dice-view" class="dice-box">🎲</div>
            <button id="action-btn" class="btn-main" onclick="rollDice()">擲骰子前進</button>
        </div>
    </div>

    <!-- ─── 互動小遊戲萬能天幕 ─── -->
    <div id="mini-game-screen" class="mini-game-overlay">
        <div class="game-window">
            <h3 id="game-title" style="color:#fbbf24; margin:0 0 5px 0; font-size:18px; text-align:center;"></h3>
            <p id="game-desc" style="font-size:12px; color:#cbd5e1; margin:0 0 10px 0; text-align:center;"></p>
            
            <!-- 動態注入互動區 -->
            <div class="interactive-zone" id="game-zone"></div>
            
            <div id="game-status-text" style="font-size:13px; color:#f43f5e; font-weight:bold;"></div>
            <button id="game-action-btn" class="interact-btn" style="display:none;"></button>
            <div class="game-timer-bar"><div id="game-timer-fill" class="game-timer-fill"></div></div>
        </div>
    </div>

    <script>
        // 真實公車站點
        const stations = [
            { name: "中壢客運總站", type: "start", icon: "🏪" },
            { name: "延平路口", type: "normal", icon: "🚏" },
            { name: "中壢監理站", type: "normal", icon: "🏢" },
            { name: "老街溪站", type: "normal", icon: "🌊" },
            { name: "中正路口", type: "normal", icon: "🚧" },
            { name: "中壢火車站後站", type: "normal", icon: "🚉" },
            { name: "健行科技大學", type: "normal", icon: "🏫" },
            { name: "大林路口", type: "normal", icon: "🚦" },
            { name: "普忠路口", type: "normal", icon: "🛣️" },
            { name: "環中東路", type: "normal", icon: "🚗" },
            { name: "中原國小", type: "normal", icon: "🎒" },
            { name: "實踐路口", type: "normal", icon: "🍱" },
            { name: "中原大學正門", type: "end", icon: "🎓" }
        ];

        // 10種完全不同機制的獨立小遊戲庫
        const gamePool = [
            { id: "intercept", title: "🎯 精準攔截：悠遊卡感應", desc: "感應器接觸不良！當紅色指針移動到綠色黃金區域時，立刻點擊按鈕刷卡！", p: -25, t: 15 },
            { id: "charge", title: "💪 蓄力長按：擠進車廂", desc: "車門快關了！長按按鈕聚集力量，當力量剛好達到80-100%時放開擠進去！", p: -20, t: 10 },
            { id: "balance", title: "⚖️ 平衡保持：急煞甩尾", desc: "公車正在瘋狂飆速急煞！連續點擊左右修正按鈕，將核心平衡保持在中央！", p: -30, t: 0 },
            { id: "dodge", title: "💦 左右閃躲：空調口漏水", desc: "頭頂空調孔要漏髒水了！注意紅色警戒燈，點擊按鈕切換左右座位閃躲！", p: -25, t: 5 },
            { id: "rhythm", title: "🎵 節奏拍擊：跟隨司機碎念", desc: "司機正在用大喇叭瘋狂廣播！在倒數正好歸零的瞬間按下按鈕隨聲附和！", p: -15, t: 10 },
            { id: "memory", title: "🧩 盲盒記憶：尋找遺落雨傘", desc: "車廂太暗了！看清發光的博愛座位置，隨後憑記憶點擊正確的方塊找出雨傘！", p: -20, t: 15 },
            { id: "mash", title: "🥊 速度對決：拉開車內打架", desc: "阿伯跟乘客打起來了！瘋狂點擊按鈕勸架，用氣勢強行拉開他們！", p: -40, t: 30 },
            { id: "hold", title: "👃 長按憋氣：明星花露水化學戰", desc: "隔壁大叔擦了整瓶明星花露水！按住按鈕不放進行憋氣，直到危險過去！", p: -25, t: 0 },
            { id: "stopwatch", title: "⏱️ 秒錶控時：精準下車鈴", desc: "馬上要過站了！在時間走到剛好 3.00 到 3.30 秒之間按下停鈴，過頭就慘了！", p: -30, t: 20 },
            { id: "wave", title: "👋 瘋狂揮手：幽靈公車防漏接", desc: "公車司機沒看到你！看準時機快速揮手（點擊3次亮起綠燈）讓司機停下！", p: -20, t: 25 }
        ];

        // 隨機洗牌，確保一次遊戲內絕不重複
        let activeGameQueue = [];
        function shuffleGames() {
            activeGameQueue = [...gamePool].sort(() => Math.random() - 0.5);
        }

        let patience = 120; let timeCost = 0; let currentIdx = 0; let isGameOver = false;
        
        // 核心小遊戲引擎變數
        let gameTimer = null; let gameLogicInterval = null; let gameTimeLeft = 100;
        let gameSuccess = false; let gameMeta = {};

        function initMap() {
            const container = document.getElementById("timeline-container");
            container.innerHTML = "";
            stations.forEach((st, i) => {
                const node = document.createElement("div");
                node.className = `timeline-node st-${st.type}`; node.id = `node-${i}`;
                node.innerHTML = `<div class="node-circle">${st.icon}</div><div class="node-info-text"><div class="node-title">${st.name}</div><div class="node-meta">${st.type==='start'?'起點':st.type==='end'?'終點':'未知盲盒事件'}</div></div>`;
                container.appendChild(node);
            });
            shuffleGames(); setTimeout(moveBusMarker, 100);
        }

        function moveBusMarker() {
            const bus = document.getElementById("bus-marker"); const targetNode = document.getElementById(`node-${currentIdx}`);
            document.querySelectorAll('.timeline-node').forEach(n => n.classList.remove('active')); targetNode.classList.add('active');
            const topPos = targetNode.offsetTop + (targetNode.querySelector('.node-circle').offsetHeight / 2);
            bus.style.top = `${topPos}px`;
            document.getElementById("map-scroll-box").scrollTo({ top: targetNode.offsetTop - 40, behavior: 'smooth' });
        }

        function rollDice() {
            if (isGameOver) return;
            document.getElementById("action-btn").disabled = true;
            const dice = Math.floor(Math.random() * 2) + 1;
            document.getElementById("dice-view").innerText = "⏳";

            setTimeout(() => {
                document.getElementById("dice-view").innerText = dice === 1 ? "⚀" : "⚁";
                let count = 0;
                let interval = setInterval(() => {
                    if (count < dice && currentIdx < stations.length - 1) {
                        currentIdx++; moveBusMarker(); count++;
                    } else {
                        clearInterval(interval);
                        // 85% 機率觸發小遊戲
                        if (currentIdx === stations.length - 1) {
                            settleGame(0, 0, "🎉 抵達校園！", "成功挺過公車地獄，活著踏入中原大學！");
                        } else if (Math.random() < 0.85 && activeGameQueue.length > 0) {
                            launchEngine(activeGameQueue.pop());
                        } else {
                            settleGame(-10, 10, "🚗 平穩行駛", "這一站運氣不錯，路上只有輕微塞車，沒有奇怪的乘客。");
                        }
                    }
                }, 800);
            }, 300);
        }

        // ─────── 萬能互動遊戲發射器 ───────
        function launchEngine(g) {
            gameMeta = g; gameTimeLeft = 100; gameSuccess = false;
            document.getElementById("game-title").innerText = g.title;
            document.getElementById("game-desc").innerText = g.desc;
            document.getElementById("game-status-text").innerText = "";
            
            const zone = document.getElementById("game-zone");
            const actBtn = document.getElementById("game-action-btn");
            zone.innerHTML = ""; actBtn.style.display = "none";
            actBtn.onmousedown = null; actBtn.onmouseup = null; actBtn.onclick = null;
            
            clearInterval(gameLogicInterval);
            document.getElementById("mini-game-screen").style.display = "flex";

            // ─── 根據 ID 載入 10 種玩法 ───
            if (g.id === "intercept") {
                zone.innerHTML = `<div class="slider-track"><div class="slider-target"></div><div class="slider-pin" id="ipin"></div></div>`;
                actBtn.style.display = "block"; actBtn.innerText = "就是現在！刷卡";
                let pos = 0; let dir = 3.5; // 稍微加速配合增長的時間
                gameLogicInterval = setInterval(() => {
                    pos += dir; if(pos >= 95 || pos <= 0) dir = -dir;
                    document.getElementById("ipin").style.left = pos + "%";
                }, 20);
                actBtn.onclick = () => {
                    clearInterval(gameLogicInterval);
                    gameSuccess = (pos >= 42 && pos <= 60);
                    endMiniGameEarly();
                };
            } 
            else if (g.id === "charge") {
                zone.innerHTML = `<div class="charge-ring"><div class="charge-fill" id="cfill"></div><span id="ctx" style="font-weight:bold; z-index:6;">0%</span></div>`;
                actBtn.style.display = "block"; actBtn.innerText = "按住蓄力擠入！";
                let charge = 0; let isCharging = false;
                gameLogicInterval = setInterval(() => {
                    if (isCharging) {
                        charge += 2; if(charge > 100) charge = 100;
                        document.getElementById("ctx").innerText = charge + "%";
                        document.getElementById("cfill").style.display = "block";
                        document.getElementById("cfill").style.transform = `rotate(${(-45 + (charge * 3.6))}deg)`;
                    }
                }, 40);
                actBtn.onmousedown = actBtn.ontouchstart = () => { isCharging = true; };
                actBtn.onmouseup = actBtn.ontouchend = () => {
                    isCharging = false; clearInterval(gameLogicInterval);
                    gameSuccess = (charge >= 80 && charge <= 100);
                    endMiniGameEarly();
                };
            }
            else if (g.id === "balance") {
                zone.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%; gap:20px;"><div class="balance-board" id="bboard"><div class="balance-ball" id="bball"></div></div><div style="display:flex; gap:20px;"><button class="interact-btn" id="bl">◀ 靠左</button><button class="interact-btn" id="br">靠右 ▶</button></div></div>`;
                let ballPos = 50;
                gameLogicInterval = setInterval(() => {
                    ballPos += (Math.random() - 0.5) * 10;
                    if(ballPos < 5 || ballPos > 95) { ballPos = ballPos < 5 ? 0 : 100; }
                    document.getElementById("bball").style.left = ballPos + "%";
                    document.getElementById("bboard").style.transform = `rotate(${(ballPos - 50)*0.5}deg)`;
                }, 60);
                zone.querySelector("#bl").onclick = () => { ballPos -= 12; };
                zone.querySelector("#br").onclick = () => { ballPos += 12; };
                // 延長判定：時間到時球在安全範圍內即成功
                setTimeout(() => { gameSuccess = (ballPos > 10 && ballPos < 90); }, 6800);
            }
            else if (g.id === "dodge") {
                zone.innerHTML = `<div class="dodge-container"><div class="dodge-lane" id="lane0"><div class="player-box" id="pbox">🧍</div></div><div class="dodge-lane" id="lane1"></div></div>`;
                actBtn.style.display = "block"; actBtn.innerText = "切換換座位";
                let currentLane = 0; let dangerLane = 1;
                gameLogicInterval = setInterval(() => {
                    dangerLane = Math.floor(Math.random() * 2);
                    document.getElementById("lane0").className = dangerLane === 0 ? "dodge-lane danger" : "dodge-lane";
                    document.getElementById("lane1").className = dangerLane === 1 ? "dodge-lane danger" : "dodge-lane";
                    if (currentLane === dangerLane) { gameSuccess = false; document.getElementById("game-status-text").innerText = "❌ 被髒水淋到了！"; }
                }, 1400); // 延長閃爍間隔
                actBtn.onclick = () => {
                    currentLane = currentLane === 0 ? 1 : 0;
                    document.getElementById("lane" + currentLane).appendChild(document.getElementById("pbox"));
                };
                setTimeout(() => { gameSuccess = (currentLane !== dangerLane); }, 6800);
            }
            else if (g.id === "rhythm") {
                let rTime = (Math.random() * 2 + 4.5).toFixed(2); // 調整初始倒數時間
                zone.innerHTML = `<div style="font-size:36px; font-weight:bold; color:#f43f5e;" id="rtimer">${rTime}</div>`;
                actBtn.style.display = "block"; actBtn.innerText = "就是現在按！";
                gameLogicInterval = setInterval(() => {
                    rTime = (rTime - 0.05).toFixed(2);
                    if(rTime <= 0) rTime = 0.00;
                    document.getElementById("rtimer").innerText = rTime;
                }, 50);
                actBtn.onclick = () => {
                    clearInterval(gameLogicInterval);
                    gameSuccess = (Math.abs(rTime - 0) <= 0.20); 
                    endMiniGameEarly();
                };
            }
            else if (g.id === "memory") {
                zone.innerHTML = `<div class="memory-grid" id="mgrid"><div class="grid-block" data-i="0"></div><div class="grid-block" data-i="1"></div><div class="grid-block" data-i="2"></div><div class="grid-block" data-i="3"></div><div class="grid-block" data-i="4"></div><div class="grid-block" data-i="5"></div><div class="grid-block" data-i="6"></div><div class="grid-block" data-i="7"></div><div class="grid-block" data-i="8"></div></div>`;
                let ans = Math.floor(Math.random() * 9);
                const blocks = zone.querySelectorAll(".grid-block");
                blocks[ans].classList.add("active");
                setTimeout(() => {
                    blocks[ans].classList.remove("active");
                    blocks.forEach(b => {
                        b.onclick = () => {
                            if(parseInt(b.dataset.i) === ans) {
                                b.style.background = "#10b981"; gameSuccess = true;
                            } else {
                                b.style.background = "#f43f5e"; gameSuccess = false;
                            }
                            endMiniGameEarly();
                        }
                    });
                }, 1500); // 延長記憶觀看時間
            }
            // 💥 【全新升級：熱血打架動畫機制】
            else if (g.id === "mash") {
                let clicks = 18; // 配合 7 秒延長，稍微提高到 18 次連擊
                zone.innerHTML = `
                    <div class="fight-arena">
                        <div class="fighter fighter-left" id="f-left">👴</div>
                        <div class="clash-fx" id="cfx">💥 PUNCH!</div>
                        <div class="fighter fighter-right" id="f-right">🧔</div>
                    </div>
                `;
                document.getElementById("game-status-text").innerText = `勸架進度：還需要拉開 ${clicks} 次！`;
                actBtn.style.display = "block"; actBtn.innerText = "🤝 強行勸架（連續猛點）！";
                
                actBtn.onclick = () => {
                    clicks--;
                    document.getElementById("game-status-text").innerText = `勸架進度：還需要拉開 ${clicks} 次！`;
                    
                    // 觸發擊打特效動畫
                    const fx = document.getElementById("cfx");
                    fx.classList.add("hit");
                    setTimeout(() => fx.classList.remove("hit"), 100);

                    // 成功拉開
                    if(clicks <= 0) { 
                        gameSuccess = true; 
                        document.getElementById("f-left").style.transform = "translateX(-80px)";
                        document.getElementById("f-right").style.transform = "translateX(80px)";
                        document.getElementById("f-left").innerText = "😇";
                        document.getElementById("f-right").innerText = "😭";
                        endMiniGameEarly(); 
                    }
                };
            }
            else if (g.id === "hold") {
                zone.innerHTML = `<div style="font-size:40px;" id="emj">😮</div>`;
                actBtn.style.display = "block"; actBtn.innerText = "按住不放進行憋氣！";
                let holdTime = 0;
                actBtn.onmousedown = actBtn.ontouchstart = () => {
                    document.getElementById("emj").innerText = "🤢";
                    gameLogicInterval = setInterval(() => { holdTime += 100; }, 100);
                };
                actBtn.onmouseup = actBtn.ontouchend = () => {
                    document.getElementById("emj").innerText = "😮";
                    clearInterval(gameLogicInterval);
                };
                setTimeout(() => { gameSuccess = (holdTime >= 5500); }, 6800); // 配合時間延長，需憋氣滿 5.5 秒
            }
            else if (g.id === "stopwatch") {
                let sw = 0.00;
                zone.innerHTML = `<div style="font-size:36px; font-weight:bold; color:#3b82f6;" id="swtext">0.00 秒</div>`;
                actBtn.style.display = "block"; actBtn.innerText = "按鈴下車！";
                gameLogicInterval = setInterval(() => {
                    sw += 0.04; document.getElementById("swtext").innerText = sw.toFixed(2) + " 秒";
                }, 40);
                actBtn.onclick = () => {
                    clearInterval(gameLogicInterval);
                    gameSuccess = (sw >= 4.50 && sw <= 5.00); // 延長至 4.5 ~ 5 秒間按鈴
                    endMiniGameEarly();
                };
            }
            else if (g.id === "wave") {
                let waveCount = 0;
                zone.innerHTML = `<div style="width:60px; height:60px; background:#334155; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;" id="lite">🔴</div>`;
                actBtn.style.display = "block"; actBtn.innerText = "快速揮手！";
                actBtn.onclick = () => {
                    waveCount++;
                    if(waveCount >= 3) {
                        document.getElementById("lite").innerText = "🟢"; document.getElementById("lite").style.background = "#10b981";
                        gameSuccess = true; endMiniGameEarly();
                    }
                };
            }

            // ⏱️ 【全域展場優化】：倒數時間從原來的 4秒 延長到 7秒（每100ms扣除約1.42%）
            gameTimer = setInterval(() => {
                gameTimeLeft -= 1.42;
                document.getElementById("game-timer-fill").style.width = `${gameTimeLeft}%`;
                if (gameTimeLeft <= 0) {
                    clearInterval(gameTimer); clearInterval(gameLogicInterval);
                    document.getElementById("mini-game-screen").style.display = "none";
                    wrapMiniGameResult();
                }
            }, 100);
        }

        function endMiniGameEarly() {
            clearInterval(gameTimer); clearInterval(gameLogicInterval);
            setTimeout(() => {
                document.getElementById("mini-game-screen").style.display = "none";
                wrapMiniGameResult();
            }, 500);
        }

        // ─────── 結算小遊戲成敗 ───────
        function wrapMiniGameResult() {
            let pMod = gameMeta.p; let tMod = gameMeta.t;
            let title = ""; let finalDesc = "";

            if (gameSuccess) {
                pMod = Math.floor(pMod * 0.2) + 10; tMod = Math.floor(tMod * 0.2);
                title = `⚡ 完美應對 (${gameMeta.title.split("：")[1]})`;
                finalDesc = `你反應極快，成功化解了公車上的突發狀況！`;
            } else {
                pMod = pMod - 15; tMod = tMod + 15;
                title = `❌ 應對失敗 (${gameMeta.title.split("：")[1]})`;
                finalDesc = `操作遺憾失誤！公車內部的混亂徹底摧毀了你的心情，通勤進度大落後。`;
            }
            settleGame(pMod, tMod, title, finalDesc);
        }

        function settleGame(pMod, tMod, title, desc) {
            patience += pMod; timeCost += tMod;
            if (patience > 120) patience = 120; if (patience < 0) patience = 0;
            if (timeCost < 0) timeCost = 0; if (timeCost > 100) timeCost = 100;

            document.getElementById("bar-pat").style.width = `${(patience / 120) * 100}%`;
            document.getElementById("text-pat").innerText = `${patience}/120`;
            document.getElementById("bar-time").style.width = `${(timeCost / 100) * 100}%`;
            document.getElementById("text-time").innerText = `${timeCost}/100分`;

            document.getElementById("ev-title").innerText = title;
            document.getElementById("ev-impact").innerText = `${pMod>=0?'+':''}${pMod} 理智 | ${tMod>=0?'+':''}${tMod} 分鐘`;
            document.getElementById("ev-desc").innerText = `【${stations[currentIdx].name}】${desc}`;

            if (patience <= 0) {
                document.getElementById("ev-title").innerText = "💥 理智全面崩潰！";
                document.getElementById("ev-desc").innerText = "你氣到直接把悠遊卡摔在司機臉上，原地跳車改搭 Uber，本次通勤大失敗！"; endGame();
            } else if (timeCost >= 100) {
                document.getElementById("ev-title").innerText = "⏰ 終極遲到王！";
                document.getElementById("ev-desc").innerText = "一路上耗費了超過100分鐘。當你走到中原大學教室門口時，大家都在收拾書包準備放學了。"; endGame();
            } else if (currentIdx === stations.length - 1) {
                document.getElementById("ev-title").innerText = "🎉 順利抵達中原大學！";
                document.getElementById("ev-desc").innerText = `奇蹟！你成功在時限內突破多重考驗。剩餘理智：${patience}點，總耗時：${timeCost}分鐘。你是真正的桃園通勤之神！`; endGame();
            } else {
                document.getElementById("action-btn").disabled = false;
            }
        }

        function endGame() {
            isGameOver = true; const btn = document.getElementById("action-btn");
            btn.disabled = false; btn.className = "btn-main btn-restart";
            btn.innerText = "🔄 重新洗牌，再次挑戰"; btn.onclick = restartGame;
        }

        function restartGame() {
            patience = 120; timeCost = 0; currentIdx = 0; isGameOver = false;
            document.getElementById("ev-title").innerText = "📢 盲盒地獄已重洗";
            document.getElementById("ev-desc").innerText = "10種不重複的互動小遊戲與路況已全部打亂重組，再次出發吧！";
            document.getElementById("dice-view").innerText = "🎲";
            const btn = document.getElementById("action-btn");
            btn.className = "btn-main"; btn.innerText = "擲骰子前進"; btn.onclick = rollDice;
            initMap();
        }

        initMap();
    </script>
</body>
</html>
