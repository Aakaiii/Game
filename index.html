<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桃園公車通勤地獄：相容性終極版</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0f19; color: #ffffff; padding: 15px; text-align: center; }
        .game-layout { background: #1e293b; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; }
        .stat { background: #0f172a; padding: 10px; margin: 10px 0; border-radius: 8px; font-weight: bold; }
        .btn-main { background: #fbbf24; color: #0f172a; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 15px; }
        .btn-main:disabled { background: #475569; color: #94a3b8; }
        /* 小遊戲遮罩 */
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .zone { width: 100%; height: 100px; background: #0f172a; margin: 20px 0; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px dashed #fbbf24; }
    </style>
</head>
<body>

    <h1>桃園公車通勤地獄</h1>
    <p>【純同步穩定版】相容所有舊款手機與電腦瀏覽器</p>

    <div class="game-layout">
        <div class="stat">🧠 理智值: <span id="txt-pat">120</span> / 120</div>
        <div class="stat">⏰ 時間: <span id="txt-time">0</span> / 100 分鐘</div>
        <div class="stat" style="font-size: 24px;">目前站點：<span id="txt-station">中壢客運總站</span></div>

        <div style="background:#0f172a; padding:15px; border-radius:8px; margin:15px 0; text-align:left; min-height:80px;">
            <b id="ev-title" style="color:#fbbf24;">📢 準備發車</b><br>
            <span id="ev-desc" style="font-size:14px; color:#cbd5e1;">點擊下方按鈕開始前進！</span>
        </div>

        <div style="font-size: 40px; margin: 10px;" id="dice-view">🎲</div>
        <button id="action-btn" class="btn-main" onclick="rollDice()">擲骰子前進</button>
    </div>

    <div id="game-screen" class="overlay">
        <h2 id="game-title" style="color:#fbbf24;"></h2>
        <p id="game-desc" style="max-width:300px; text-align:center;"></p>
        <div class="zone" id="game-zone"></div>
        <button id="game-btn" class="btn-main" style="max-width:300px;"></button>
    </div>

    <script>
        const stations = ["中壢客運總站", "延平路口", "中壢監理站", "老街溪站", "中正路口", "中壢火車站後站", "健行科技大學", "普忠路口", "環中東路", "中原大學正門"];
        const games = [
            { id: "mash", title: "🥊 速度對決：拉開車內打架", desc: "阿伯跟乘客打起來了！連續點擊按鈕 5 次勸架！", need: 5 },
            { id: "wave", title: "👋 瘋狂揮手：幽靈公車防漏接", desc: "司機沒看到你！看準時機快速揮手點擊 3 次！", need: 3 }
        ];

        let patience = 120; let timeCost = 0; let currentIdx = 0; let isGameOver = false;
        let curGame = null; let clickCount = 0;

        function rollDice() {
            if (isGameOver) { restartGame(); return; }
            
            // 拔掉所有計時器與動畫，改為「純同步」瞬間結算
            const dice = Math.floor(Math.random() * 2) + 1;
            document.getElementById("dice-view").innerText = dice === 1 ? "⚀" : "⚁";
            
            currentIdx += dice;
            if (currentIdx >= stations.length - 1) currentIdx = stations.length - 1;
            
            document.getElementById("txt-station").innerText = stations[currentIdx];

            // 終點判斷
            if (currentIdx === stations.length - 1) {
                settle(0, 0, "🎉 抵達校園！", "成功挺過公車地獄，活著踏入中原大學！");
                return;
            }

            // 隨機觸核小遊戲
            if (Math.random() < 0.7) {
                startMiniGame();
            } else {
                settle(-10, 10, "🚗 平穩行駛", "路況正常，順利前進。");
            }
        }

        function startMiniGame() {
            curGame = games[Math.floor(Math.random() * games.length)];
            clickCount = curGame.need;

            document.getElementById("game-title").innerText = curGame.title;
            document.getElementById("game-desc").innerText = curGame.desc;
            document.getElementById("game-zone").innerText = curGame.id === "mash" ? "👴 💢 🧔" : "🛑 🚌 🛑";
            
            const btn = document.getElementById("game-btn");
            btn.innerText = `點擊！還剩 ${clickCount} 次`;
            
            // 傳統 onclick，確保電腦手機都能點
            btn.onclick = function() {
                clickCount--;
                if (clickCount > 0) {
                    btn.innerText = `點擊！還剩 ${clickCount} 次`;
                    if(curGame.id === "mash") document.getElementById("game-zone").innerText = "💥 PUNCH! 💥";
                } else {
                    document.getElementById("game-screen").style.display = "none";
                    settle(15, 0, "⚡ 應對成功！", `成功化解了：${curGame.title}`);
                }
            };

            document.getElementById("game-screen").style.display = "flex";
        }

        function settle(pMod, tMod, title, desc) {
            patience += pMod; timeCost += tMod;
            if (patience > 120) patience = 120; if (patience < 0) patience = 0;
            if (timeCost > 100) timeCost = 100;

            document.getElementById("txt-pat").innerText = patience;
            document.getElementById("txt-time").innerText = timeCost;
            document.getElementById("ev-title").innerText = title;
            document.getElementById("ev-desc").innerText = desc;

            if (patience <= 0) {
                document.getElementById("ev-title").innerText = "💥 理智崩潰！";
                document.getElementById("ev-desc").innerText = "你原地跳車，本次通勤失敗。";
                endGame();
            } else if (timeCost >= 100) {
                document.getElementById("ev-title").innerText = "⏰ 嚴重遲到！";
                document.getElementById("ev-desc").innerText = "耗費太多時間，到學校大家都放學了。";
                endGame();
            } else if (currentIdx === stations.length - 1) {
                endGame();
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById("action-btn").innerText = "🔄 重新挑战";
        }

        function restartGame() {
            patience = 120; timeCost = 0; currentIdx = 0; isGameOver = false;
            document.getElementById("txt-pat").innerText = patience;
            document.getElementById("txt-time").innerText = timeCost;
            document.getElementById("txt-station").innerText = stations[0];
            document.getElementById("ev-title").innerText = "📢 重新出發";
            document.getElementById("ev-desc").innerText = "新一輪的通勤地獄開始了。";
            document.getElementById("action-btn").innerText = "擲骰子前進";
            document.getElementById("dice-view").innerText = "🎲";
        }
    </script>
</body>
</html>
